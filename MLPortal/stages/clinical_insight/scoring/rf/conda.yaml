name: nhs-knee-rf-inference
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip:
    - azureml-inference-server-http
    # numpy >= 2.0 required: pipeline pickled with numpy 2.x (uses numpy._core)
    - "numpy>=2.0.0"
    # sklearn 1.7.x is the highest version supporting Python 3.10
    # Pipeline was saved with 1.8.0 but 1.7.x loads it with a version warning only
    - "scikit-learn>=1.7.2,<1.8"
    - "pandas>=2.1.0"
    - "joblib>=1.3.0"
